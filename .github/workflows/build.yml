name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR or branch supersedes runs still queued for older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Pin Python version for uv
        run: echo '${{ matrix.python-version }}' > .python-version

      - name: Install package and dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra dev

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --extra docs

      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
