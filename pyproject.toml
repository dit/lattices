[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata (PEP 621) ──────────────────────────────────────────

[project]
name = "lattices"
dynamic = ["version"]
description = "Package for the construction of lattices from a set of nodes and an ordering relation."
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "Ryan G. James", email = "ryangregoryjames@gmail.com" },
]
keywords = ["lattice", "partial order", "graph", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "networkx",
]

[project.urls]
Homepage = "https://github.com/dit/lattices"
Repository = "https://github.com/dit/lattices"

[project.optional-dependencies]
plotting = [
    "matplotlib",
]
test = [
    "codecov",
    "pytest>=4.4.0",
    "pytest-cov",
    "pytest-xdist",
]
docs = [
    "ipython[nbconvert]",
    "sphinx",
]
dev = [
    "lattices[test]",
    "lattices[docs]",
    "lattices[plotting]",
    "coverage[toml]",
    "nxpd",
    "ruff",
]

# ── Build configuration ─────────────────────────────────────────────────

[tool.hatch.version]
path = "lattices/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "lattices/",
    "tests/",
    "README.rst",
    "LICENSE.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["lattices"]

# ── Pytest ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
addopts = [
    "--cov=lattices",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--numprocesses=auto",
]

# ── Coverage ─────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["lattices"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def _repr_*_",
    "if self\\.debug",
    "@removals.remove",
    "@abstractmethod",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def setup_module",
    "def teardown_module",
    "except RuntimeError",
    "return NotImplemented",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

# ── Ruff (replaces flake8 + isort) ──────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "E731",   # lambda assignment
    "E722",   # bare except
    "F403",   # star imports
    "F405",   # may be undefined from star import
    "N802",   # function name should be lowercase
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N812",   # non-lowercase variables as import aliases
    "N816",   # mixed case variable in global scope
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["lattices"]
